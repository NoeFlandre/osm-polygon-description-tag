repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      # Ruff runs from the locked environment, so pre-commit and CI use the
      # exact version in uv.lock instead of a second pin that can drift.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: contract-tests
        name: contract tests
        entry: env PYTHONPATH=. uv run pytest tests/contracts -q
        language: system
        pass_filenames: false
