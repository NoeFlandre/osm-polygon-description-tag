name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run has nothing left to prove; do not pay for it twice.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify lockfile
        run: uv lock --check

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check

      - name: Audit locked dependencies
        run: scripts/audit_locked_dependencies.sh

      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir /tmp/osm-polygon-description-tag-site

      - name: Test with coverage
        run: >-
          mkdir -p reports &&
          uv run pytest
          --cov=osm_polygon_description_tag
          --cov=scripts
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:reports/coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: reports/coverage.json
          if-no-files-found: error
          retention-days: 1

      - name: Build distributions
        run: uv build

      - name: Smoke-test CLI
        run: |
          uv run osm-polygon-description-tag --help
          uv run osm-polygon-description-tag run-and-publish --help

      # `uv run` above uses the editable dev environment. Install only the
      # built wheel into a clean venv, outside the repository, and check that
      # every module imports and every packaged data file shipped intact.
      - name: Smoke-test the built wheel in a clean venv
        run: |
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv dist/*.whl
          /tmp/wheel-venv/bin/osm-polygon-description-tag --help
          (cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_package.py" \
            --source-root "$GITHUB_WORKSPACE/src/osm_polygon_description_tag")

      # The lockfile only proves the newest versions work. Install the lowest
      # declared direct dependencies (wheels only) and run the built CLI.
      - name: Smoke-test lowest declared dependencies
        run: |
          uv venv --python 3.12 /tmp/lowest
          uv pip install --python /tmp/lowest --resolution lowest-direct --only-binary :all: -r pyproject.toml
          uv pip install --python /tmp/lowest --no-deps dist/*.whl
          /tmp/lowest/bin/osm-polygon-description-tag --help
          /tmp/lowest/bin/osm-polygon-description-tag run-and-publish --help

      - name: Verify wheel contents
        run: >-
          uv run python -c
          "from pathlib import Path; import zipfile;
          wheel=max(Path('dist').glob('*.whl'), key=lambda p:p.stat().st_mtime_ns);
          names=set(zipfile.ZipFile(wheel).namelist());
          required={'osm_polygon_description_tag/_data/osmium-export.json',
          'osm_polygon_description_tag/_data/dataset-card-template.md',
          'osm_polygon_description_tag/py.typed',
          'osm_polygon_description_tag/README.md',
          'osm_polygon_description_tag/runtime/README.md',
          'osm_polygon_description_tag/osm/README.md',
          'osm_polygon_description_tag/dataset/README.md',
          'osm_polygon_description_tag/publication/README.md',
          'osm_polygon_description_tag/workflow/README.md'};
          missing=required-names; assert not missing, missing"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-description-tag:ci .

      - name: Verify the harmless CLI default
        run: docker run --rm osm-polygon-description-tag:ci --help

      - name: Verify the bundled osmium binary
        run: docker run --rm --entrypoint osmium osm-polygon-description-tag:ci --version

      - name: Verify the image runs as a non-root user with the roots preset
        run: |
          test "$(docker run --rm --entrypoint id osm-polygon-description-tag:ci -u)" != "0"
          docker run --rm --entrypoint printenv osm-polygon-description-tag:ci \
            OSM_POLYGON_SOURCE_ROOT OSM_POLYGON_DATA_ROOT

      - name: Dry-run the pipeline on a fixture inside the image
        run: |
          # Exercises the real entrypoint, osmium binary and packaged data
          # offline, without publishing anything.
          mkdir -p ci-data ci-source
          chmod -R a+rwX ci-data ci-source
          docker run --rm --entrypoint osmium \
            -v "$PWD/tests/fixtures:/fixtures:ro" -v "$PWD/ci-source:/source" \
            osm-polygon-description-tag:ci \
            cat /fixtures/descriptions.osm -o /source/fixture.osm.pbf
          docker run --rm -e HF_HUB_OFFLINE=1 \
            -v "$PWD/ci-data:/data" -v "$PWD/ci-source:/source:ro" \
            osm-polygon-description-tag:ci inspect

      - name: Validate the compose file and run through it
        run: |
          docker compose config --quiet
          mkdir -p data-root/raw
          docker compose run --rm --build pipeline --help

  risk:
    # The CRAP budget is a single whole-repository measurement, so it runs once
    # rather than once per mutation shard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Restore coverage from the quality job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-json
          path: reports

      - name: Run all-source CRAP budget gate
        run: just risk-prepared

      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap-report
          path: |
            reports/crap.json
            reports/crap.md
          if-no-files-found: error

  mutation-scope:
    # Pull requests mutate exactly the source lines the PR changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HYPOTHESIS_PROFILE: mutation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Select changed source scope
        id: scope
        run: |
          git diff --unified=0 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- 'src/**/*.py' 'scripts/**/*.py' > "$RUNNER_TEMP/mutation-scope.txt"
          # A pull request that touches no Python source has nothing to mutate,
          # so the gate is skipped rather than failed.
          if [ -s "$RUNNER_TEMP/mutation-scope.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Python source changed; the mutation gate has nothing to mutate."
          fi

      - name: Run changed-source mutation gate
        if: steps.scope.outputs.changed == 'true'
        run: >-
          just mutation-scope
          "$RUNNER_TEMP/mutation-scope.txt"

      - name: Upload mutation report
        if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-score-scope
          path: reports/mutation-summary.json
          if-no-files-found: error

  mutation-contexts:
    # Coverage contexts are a pure function of the source and the test suite, so
    # they are identical in every shard. Generating them once and sharing the
    # database removes one full suite run per shard.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HYPOTHESIS_PROFILE: mutation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Record per-test coverage contexts
        run: just mutation-contexts

      - name: Upload coverage contexts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-coverage-contexts
          path: data-root/.tmp/.coverage-ctx
          # the database name starts with a dot, which this action skips by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  mutation-all:
    # Main pushes run the exhaustive all-source gate, split across shards so it
    # finishes. A single runner took over 90 minutes and was cancelled on every
    # push, which meant the gate never actually reported. Each shard still
    # requires a 100% score, so the shards together are the same strict gate.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality, mutation-contexts]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HYPOTHESIS_PROFILE: mutation
      MUTATION_SHARD_COUNT: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Select this shard's source files
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          # mutmut's forced-fail probe runs tests/unit/dataset/test_text.py,
          # so every shard has to mutate something those tests reach. The canary
          # is mutated by all shards but scored only by the shard that owns it,
          # which keeps the scoring a clean partition of the source tree.
          CANARY = "src/osm_polygon_description_tag/dataset/text.py"

          roots = (pathlib.Path("src"), pathlib.Path("scripts"))
          files = sorted(str(path) for root in roots for path in root.rglob("*.py"))
          count = int(os.environ["MUTATION_SHARD_COUNT"])
          index = int(os.environ["MUTATION_SHARD"])
          # Round-robin by position put the heavy modules together: one shard
          # ran 3-4x longer than the others and set the whole job's wall clock.
          # Longest-processing-time-first on file size balances them instead.
          loads = [0] * count
          buckets: list[list[str]] = [[] for _ in range(count)]
          for path in sorted(files, key=lambda f: (-pathlib.Path(f).stat().st_size, f)):
              lightest = min(range(count), key=lambda b: (loads[b], b))
              buckets[lightest].append(path)
              loads[lightest] += pathlib.Path(path).stat().st_size
          shard = sorted(buckets[index])

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          temp.joinpath("mutation-shard.txt").write_text("".join(f"{f}\n" for f in shard))
          mutate = shard if CANARY in shard else [*shard, CANARY]
          temp.joinpath("mutation-mutate.txt").write_text("".join(f"{f}\n" for f in sorted(mutate)))
          print(f"scored: {len(shard)} files; mutated: {len(mutate)} files")
          PY

      - name: Restore shared coverage contexts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-coverage-contexts
          path: data-root/.tmp

      - name: Run the sharded all-source mutation gate
        run: >-
          just mutation-shard-prepared
          "$RUNNER_TEMP/mutation-shard.txt"
          "$RUNNER_TEMP/mutation-mutate.txt"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-score-shard-${{ matrix.shard }}
          path: reports/mutation-summary.json
          if-no-files-found: error

  # Advisory: continue-on-error keeps a noisy shared runner from failing ci-ok.
  # Times the base and the head on the same runner.
  benchmarks:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python and just
        run: |
          uv python install 3.12
          sudo apt-get update
          sudo apt-get install -y just

      - name: Time the base
        run: |
          uv sync --frozen
          git checkout "${{ github.event.pull_request.head.sha }}" -- benchmarks
          # The base lockfile predates pytest-benchmark, so add it for this run only.
          uv run --with "pytest-benchmark>=5.3,<6" pytest benchmarks --no-cov \
            -p no:cacheprovider -q --benchmark-save=base

      - name: Time the head against it
        run: |
          git checkout --force "${{ github.event.pull_request.head.sha }}"
          uv sync --frozen
          just bench-compare

  # The one check to require in branch protection. Which of the jobs above run
  # depends on the event (mutation-scope on pull requests, the sweeps on push),
  # so a skipped job is fine; a failed or cancelled one is not.
  ci-ok:
    if: always()
    needs: [quality, container, risk, mutation-scope, mutation-contexts, mutation-all, benchmarks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended as: $result" >&2; exit 1 ;;
            esac
          done
