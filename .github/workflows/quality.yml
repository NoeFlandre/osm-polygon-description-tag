name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify lockfile
        run: uv lock --check

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check

      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir /tmp/osm-polygon-description-tag-site

      - name: Test with coverage
        run: >-
          uv run pytest
          --cov=osm_polygon_description_tag
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build distributions
        run: uv build

      - name: Smoke-test CLI
        run: |
          uv run osm-polygon-description-tag --help
          uv run osm-polygon-description-tag run-and-publish --help

      - name: Verify wheel contents
        run: >-
          uv run python -c
          "from pathlib import Path; import zipfile;
          wheel=max(Path('dist').glob('*.whl'), key=lambda p:p.stat().st_mtime_ns);
          names=set(zipfile.ZipFile(wheel).namelist());
          required={'osm_polygon_description_tag/_data/osmium-export.json',
          'osm_polygon_description_tag/_data/dataset-card-template.md',
          'osm_polygon_description_tag/py.typed',
          'osm_polygon_description_tag/README.md',
          'osm_polygon_description_tag/runtime/README.md',
          'osm_polygon_description_tag/osm/README.md',
          'osm_polygon_description_tag/dataset/README.md',
          'osm_polygon_description_tag/publication/README.md',
          'osm_polygon_description_tag/workflow/README.md'};
          missing=required-names; assert not missing, missing"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-description-tag:ci .

      - name: Verify the harmless CLI default
        run: docker run --rm osm-polygon-description-tag:ci --help

      - name: Verify the bundled osmium binary
        run: docker run --rm --entrypoint osmium osm-polygon-description-tag:ci --version

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run publication-planning and dataset-statistics CRAP budget gate
        run: just risk

      - name: Run publication-planning mutation gate
        run: just mutation

      - name: Upload mutation and CRAP reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mutation-score
          path: |
            reports/crap.json
            reports/crap.md
            reports/mutation-summary.json
          if-no-files-found: error
