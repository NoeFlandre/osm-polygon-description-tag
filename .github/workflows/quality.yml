name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify lockfile
        run: uv lock --check

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check

      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir /tmp/osm-polygon-description-tag-site

      - name: Test with coverage
        run: >-
          mkdir -p reports &&
          uv run pytest
          --cov=osm_polygon_description_tag
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:reports/coverage.json
          --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-json
          path: reports/coverage.json
          if-no-files-found: error
          retention-days: 1

      - name: Build distributions
        run: uv build

      - name: Smoke-test CLI
        run: |
          uv run osm-polygon-description-tag --help
          uv run osm-polygon-description-tag run-and-publish --help

      - name: Verify wheel contents
        run: >-
          uv run python -c
          "from pathlib import Path; import zipfile;
          wheel=max(Path('dist').glob('*.whl'), key=lambda p:p.stat().st_mtime_ns);
          names=set(zipfile.ZipFile(wheel).namelist());
          required={'osm_polygon_description_tag/_data/osmium-export.json',
          'osm_polygon_description_tag/_data/dataset-card-template.md',
          'osm_polygon_description_tag/py.typed',
          'osm_polygon_description_tag/README.md',
          'osm_polygon_description_tag/runtime/README.md',
          'osm_polygon_description_tag/osm/README.md',
          'osm_polygon_description_tag/dataset/README.md',
          'osm_polygon_description_tag/publication/README.md',
          'osm_polygon_description_tag/workflow/README.md'};
          missing=required-names; assert not missing, missing"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-description-tag:ci .

      - name: Verify the harmless CLI default
        run: docker run --rm osm-polygon-description-tag:ci --help

      - name: Verify the bundled osmium binary
        run: docker run --rm --entrypoint osmium osm-polygon-description-tag:ci --version

  risk:
    # The CRAP budget is a single whole-repository measurement, so it runs once
    # rather than once per mutation shard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Restore coverage from the quality job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-json
          path: reports

      - name: Run all-source CRAP budget gate
        run: just risk-prepared

      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crap-report
          path: |
            reports/crap.json
            reports/crap.md
          if-no-files-found: error

  mutation-scope:
    # Pull requests mutate exactly the source lines the PR changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Select changed source scope
        id: scope
        run: |
          git diff --unified=0 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- 'src/**/*.py' 'scripts/**/*.py' > "$RUNNER_TEMP/mutation-scope.txt"
          # A pull request that touches no Python source has nothing to mutate,
          # so the gate is skipped rather than failed.
          if [ -s "$RUNNER_TEMP/mutation-scope.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Python source changed; the mutation gate has nothing to mutate."
          fi

      - name: Run changed-source mutation gate
        if: steps.scope.outputs.changed == 'true'
        run: >-
          just mutation-scope
          "$RUNNER_TEMP/mutation-scope.txt"

      - name: Upload mutation report
        if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-score-scope
          path: reports/mutation-summary.json
          if-no-files-found: error

  mutation-contexts:
    # Coverage contexts are a pure function of the source and the test suite, so
    # they are identical in every shard. Generating them once and sharing the
    # database removes one full suite run per shard.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Record per-test coverage contexts
        run: just mutation-contexts

      - name: Upload coverage contexts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-coverage-contexts
          path: data-root/.tmp/.coverage-ctx
          # the database name starts with a dot, which this action skips by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  mutation-all:
    # Main pushes run the exhaustive all-source gate, split across shards so it
    # finishes. A single runner took over 90 minutes and was cancelled on every
    # push, which meant the gate never actually reported. Each shard still
    # requires a 100% score, so the shards together are the same strict gate.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality, mutation-contexts]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MUTATION_SHARD_COUNT: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install osmium and just
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool just

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Select this shard's source files
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          # mutmut's forced-fail probe runs tests/unit/dataset/test_text.py,
          # so every shard has to mutate something those tests reach. The canary
          # is mutated by all shards but scored only by the shard that owns it,
          # which keeps the scoring a clean partition of the source tree.
          CANARY = "src/osm_polygon_description_tag/dataset/text.py"

          roots = (pathlib.Path("src"), pathlib.Path("scripts"))
          files = sorted(str(path) for root in roots for path in root.rglob("*.py"))
          count = int(os.environ["MUTATION_SHARD_COUNT"])
          index = int(os.environ["MUTATION_SHARD"])
          # Round-robin by position put the heavy modules together: one shard
          # ran 3-4x longer than the others and set the whole job's wall clock.
          # Longest-processing-time-first on file size balances them instead.
          loads = [0] * count
          buckets: list[list[str]] = [[] for _ in range(count)]
          for path in sorted(files, key=lambda f: (-pathlib.Path(f).stat().st_size, f)):
              lightest = min(range(count), key=lambda b: (loads[b], b))
              buckets[lightest].append(path)
              loads[lightest] += pathlib.Path(path).stat().st_size
          shard = sorted(buckets[index])

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          temp.joinpath("mutation-shard.txt").write_text("".join(f"{f}\n" for f in shard))
          mutate = shard if CANARY in shard else [*shard, CANARY]
          temp.joinpath("mutation-mutate.txt").write_text("".join(f"{f}\n" for f in sorted(mutate)))
          print(f"scored: {len(shard)} files; mutated: {len(mutate)} files")
          PY

      - name: Restore shared coverage contexts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-coverage-contexts
          path: data-root/.tmp

      - name: Run the sharded all-source mutation gate
        run: >-
          just mutation-shard-prepared
          "$RUNNER_TEMP/mutation-shard.txt"
          "$RUNNER_TEMP/mutation-mutate.txt"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-score-shard-${{ matrix.shard }}
          path: reports/mutation-summary.json
          if-no-files-found: error
