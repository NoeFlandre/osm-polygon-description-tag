name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir site

      - name: Install Colloquium
        run: uv tool install colloquium

      - name: Build presentation decks
        run: |
          ./slides/build.sh "$RUNNER_TEMP/osm-polygon-description-tag-slides"
          mkdir -p site/slides
          cp -R "$RUNNER_TEMP/osm-polygon-description-tag-slides/codebase" site/slides/codebase
          cp -R "$RUNNER_TEMP/osm-polygon-description-tag-slides/dataset" site/slides/dataset

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
