[project]
name = "osm-polygon-description-tag"
version = "0.1.0"
description = "Reproducible GeoParquet of OpenStreetMap polygons with description tags."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Noé Flandre" }]
license = "Apache-2.0"
keywords = ["openstreetmap", "geoparquet", "geospatial", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.0,<2",
    "h3>=4.1,<5",
    "huggingface_hub>=0.24,<2",
    "matplotlib>=3.9,<4",
    "pyarrow>=20,<22",
    "pyproj>=3.7,<4",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "shapely>=2.1,<3",
    "trackio>=0.20,<1",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
]

[project.scripts]
osm-polygon-description-tag = "osm_polygon_description_tag.cli:main"

[project.urls]
Source = "https://github.com/NoeFlandre/osm-polygon-description-tag"
Issues = "https://github.com/NoeFlandre/osm-polygon-description-tag/issues"
Dataset = "https://huggingface.co/datasets/NoeFlandre/osm-polygon-description-tag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_description_tag"]
include = [
    "src/osm_polygon_description_tag/**/*.md",
    "src/osm_polygon_description_tag/_data/*.json",
    "src/osm_polygon_description_tag/_data/*.geojson",
    "src/osm_polygon_description_tag/_data/*.md",
    "src/osm_polygon_description_tag/_data/*.png",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.6,<10",
    "mutmut>=3,<4",
    "pre-commit>=4.6.1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "radon>=6,<7",
    "ruff>=0.12,<0.13",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the external osmium binary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "TID"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["osm_polygon_description_tag"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/osm_polygon_description_tag/publication/planning.py",
    "src/osm_polygon_description_tag/workflow/finalization.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/publication",
    "tests/unit/workflow/test_finalization.py",
]
timeout_multiplier = 10.0
timeout_constant = 1.0
